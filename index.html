<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caravan</title>
<style>
  body{font-family:system-ui,sans-serif;background:#d5bb8c;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1b2a41}
  .card{background:#fff;border-radius:16px;padding:32px;max-width:420px;margin:16px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.15)}
  h1{margin:0 0 8px;font-size:26px}
  p{line-height:1.5}
  a.btn{display:inline-block;margin-top:12px;padding:12px 24px;background:#4aa3b0;color:#fff;border-radius:10px;text-decoration:none;font-weight:bold}
  hr{border:none;border-top:1px solid #ddd;margin:24px 0}
</style>
</head>
<body>
<div class="card">
  <h1>המייל אושר ✓</h1>
  <p>החשבון שלך ב-Caravan מוכן. אפשר לחזור לאפליקציה ולהתחבר.</p>
  <a class="btn" href="caravan://login-callback/">פתח את Caravan</a>
  <hr>
  <div dir="ltr">
    <h1>Email confirmed ✓</h1>
    <p>Your Caravan account is ready. Go back to the app and sign in.</p>
    <a class="btn" href="caravan://login-callback/">Open Caravan</a>
  </div>
</div>
</body>
</html>
